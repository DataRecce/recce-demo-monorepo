default:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') | as_text }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PEM_FILEPATH')}}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PEM_PASSPHRASE') }}"
      role: RECCE
      database: RECCE
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'GITLAB_JAFFLE_SHOP_DEV') | as_text }}"
      warehouse: LOAD_WH
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') | as_text }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PEM_FILEPATH')}}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PEM_PASSPHRASE') }}"
      role: RECCE
      database: RECCE
      schema: GITLAB_JAFFLE_SHOP_PROD
      warehouse: LOAD_WH
      threads: 4
